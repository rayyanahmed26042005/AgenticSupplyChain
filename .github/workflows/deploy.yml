# .github/workflows/deploy.yml
name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # 1. Backend Pytest
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Backend Tests
      run: |
        cd backend
        python -m pytest

    # 2. Frontend Build Verify
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    - name: Verify Frontend Compilation
      run: |
        cd frontend
        npm run build

  deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Configure AWS Credentials using repository secrets
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 1. FRONTEND DEPLOYMENT (S3 + CloudFront Invalidation)
    - name: Set up Node.js for Production Build
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend static assets
      run: |
        cd frontend
        npm run build

    - name: Deploy Frontend static assets to S3
      run: |
        aws s3 sync frontend/dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete

    - name: Invalidate CloudFront CDN Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

    # 2. BACKEND DEPLOYMENT (Docker ECR Build + Push)
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push Backend Image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f docker/Dockerfile.backend .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 3. RUN REMOTE SSH COMMANDS ON EC2 TO PULL & RESTART
    - name: Deploy Backend Container to EC2 Server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          # Retrieve login credentials for ECR
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
          
          # Pull latest image
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
          
          # Stop and remove existing container
          docker stop backend || true
          docker rm backend || true
          
          # Run the new container
          docker run -d --name backend \
            --restart always \
            -p 8000:8000 \
            --env-file /app/.env \
            -v /app/data:/app/data \
            -v /app/logs:/app/logs \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest
