version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supply_chain_postgres
    restart: always
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: supply_chain_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: supply_chain_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres/supply_chain
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - APP_MODE=simulation
      - DATA_SOURCE=manual
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: supply_chain_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
